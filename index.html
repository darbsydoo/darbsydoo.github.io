<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Taiwan Mandarin · Body Parts</title>
  <style>
    :root { color-scheme: light; --ink:#19324a; --muted:#66788b; --paper:#fffdf8; --cream:#f7f2e8; --coral:#ed705d; --gold:#f4c45e; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Noto Sans TC",sans-serif; color:var(--ink); overscroll-behavior:none; }
    body { min-height:100svh; display:grid; place-items:center; padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom)); }
    main { width:min(100%,430px); display:grid; gap:14px; }
    header { display:flex; align-items:end; justify-content:space-between; padding:0 4px; }
    h1 { font-size:17px; line-height:1.2; margin:0; letter-spacing:.01em; }
    #count { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .progress { height:5px; background:#e7dfd2; border-radius:999px; overflow:hidden; }
    .progress>span { display:block; height:100%; width:9.09%; background:var(--coral); border-radius:inherit; transition:width .25s ease; }
    .card-wrap { perspective:1200px; }
    #card { position:relative; height:min(64svh,560px); min-height:430px; border:0; width:100%; padding:0; border-radius:30px; background:var(--paper); box-shadow:0 18px 50px rgba(35,55,74,.13),0 2px 0 rgba(255,255,255,.8) inset; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; transition:transform .16s ease,opacity .16s ease; cursor:pointer; }
    #card.moving { transition:none; }
    #card.out-left { transform:translateX(-32px) rotate(-2deg); opacity:.25; }
    #card.out-right { transform:translateX(32px) rotate(2deg); opacity:.25; }
    .picture { position:absolute; inset:0; background-position:center; background-repeat:no-repeat; background-size:cover; transition:filter .25s ease,transform .25s ease; }
    .veil { position:absolute; inset:auto 0 0; min-height:41%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:24px 18px 25px; background:linear-gradient(180deg,rgba(255,253,248,0),rgba(255,253,248,.92) 18%,var(--paper) 44%); transform:translateY(72%); opacity:0; transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease; }
    #card.revealed .veil { transform:translateY(0); opacity:1; }
    #card.revealed .picture { transform:scale(.98); filter:saturate(.9); }
    .hanzi { font-family:"Noto Serif TC","Songti TC",serif; font-size:clamp(48px,15vw,72px); line-height:1; font-weight:700; letter-spacing:.05em; }
    .english { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.16em; font-weight:700; }
    .pronunciation { display:grid; gap:5px; place-items:center; max-height:0; opacity:0; transform:translateY(8px); overflow:hidden; transition:max-height .25s ease,opacity .2s ease,transform .25s ease; }
    #card.pronounced .pronunciation { max-height:82px; opacity:1; transform:none; margin-top:7px; }
    .pinyin { font-size:21px; color:var(--coral); font-weight:750; letter-spacing:.03em; }
    .zhuyin { font-size:17px; color:var(--ink); letter-spacing:.12em; }
    .speaker { position:absolute; right:17px; top:17px; width:43px; height:43px; border-radius:50%; display:grid; place-items:center; background:rgba(255,253,248,.9); color:var(--ink); box-shadow:0 4px 18px rgba(25,50,74,.13); opacity:0; transform:scale(.8); transition:.2s ease; font-size:20px; }
    #card.revealed .speaker { opacity:1; transform:scale(1); }
    .hint { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; color:var(--muted); font-size:12px; padding:0 4px; }
    .hint span:first-child { text-align:left; }
    .hint span:last-child { text-align:right; }
    .hint b { color:var(--ink); font-size:13px; font-weight:650; }
    .dots { display:flex; justify-content:center; gap:6px; padding-top:1px; }
    .dot { width:6px; height:6px; border-radius:50%; background:#d5cbbd; transition:.2s ease; }
    .dot.active { width:18px; border-radius:999px; background:var(--coral); }
    @media (max-height:650px){ #card{height:72svh;min-height:390px}.hint{display:none} main{gap:9px} }
    @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} }
  </style>

    card.addEventListener("pointerup",()=>{
      tracking=false; card.classList.remove("moving"); card.style.transform="";
      if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){ move(dx<0?1:-1); return; }
      if(dy>50&&Math.abs(dy)>Math.abs(dx)){ reveal(true); return; }
      if(Math.abs(dx)<14&&Math.abs(dy)<14){ if(state===0)reveal(false); else speak(); }
    });
    card.addEventListener("pointercancel",()=>{tracking=false;card.classList.remove("moving");card.style.transform="";});
    document.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft")move(1);else if(e.key==="ArrowRight")move(-1);else if(e.key==="ArrowDown")reveal(true);else if(e.key===" "||e.key==="Enter")reveal(false); });
    render();
  </script>
</body>
</html>
